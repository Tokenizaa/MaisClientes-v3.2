name: Cloudflare Browser Service checks

on:
  pull_request:
    paths:
      - "cloudflare-browser-service/**"
      - ".github/workflows/cloudflare-browser-service-check.yml"
  push:
    branches:
      - feat/cloudflare-browser-service-api
    paths:
      - "cloudflare-browser-service/**"
      - ".github/workflows/cloudflare-browser-service-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-browser-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-browser-service/package-lock.json
      - run: npm install
      - run: npm run check
      - run: npm test
