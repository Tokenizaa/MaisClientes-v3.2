name = "maisclientes-api"
main = "src/worker.ts"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "maisclientes"
BROWSER_WS_ENDPOINT = "wss://designer-controlled-customs-cards.trycloudflare.com"

[[durable_objects.bindings]]
name = "SESSION_PROXY"
class_name = "ScraperSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScraperSession"]

[env.production]
name = "maisclientes-api"
compatibility_date = "2026-11-10"

[[env.production.durable_objects.bindings]]
name = "SESSION_PROXY"
class_name = "ScraperSession"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ScraperSession"]
